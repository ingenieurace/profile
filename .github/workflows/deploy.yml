# Builds the static site and publishes it to GitHub Pages.
#
# The Pages source must be set to "GitHub Actions" once, by hand, under
# Settings -> Pages in the repository.
name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  # So a deploy can be re-run from the Actions tab without a new commit.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push supersedes one still queued.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          # The "packageManager" field in package.json pins the Bun version.
          bun-version-file: package.json

      - run: bun install --frozen-lockfile
      - run: bun run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
